<!-- @dsCard group="Screens" height=720 width=1280 page=true subtitle="Proof screen: Q3 2018 plan. Switch the theme to see each era." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Plan dashboard</title></head>
<body>
<div id="root"></div>
<script>
var G = window.G2G, f = G.fmt, h = React.createElement;
function Top() {
  return h('div', { style: { height: 56, display: 'flex', alignItems: 'center', gap: 22, padding: '0 18px', background: 'var(--panel)', borderBottom: '2px solid var(--ink)' } },
    h('div', { className: 'panel-title', style: { fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 18, width: 150 } }, 'Garage to Gigawatt'),
    h(G.Stat, { label: 'Date', value: 'Q3 2018 · Turn 7/23' }),
    h(G.Stat, { label: 'Cash', value: f.money(84000), strong: true }),
    h(G.Stat, { label: 'Treasury', value: '1.2 BTC + 40 ETH · $25.9K' }),
    h('div', { className: 'g-stat' }, h('div', { className: 'g-label' }, 'Bandwidth'), h('div', { style: { paddingTop: 3 } }, h(G.Pips, { total: 3, filled: 3 }))),
    h(G.Stat, { label: 'BTC', value: '$6,480', delta: -0.09 }),
    h(G.Stat, { label: 'ETH', value: '$454', delta: 0.11 }),
    h(G.Stat, { label: 'Hashprice', value: '$323/PH/d' }),
    h('div', { style: { flexGrow: 1 } }),
    h(G.Button, null, 'Settings'));
}
function Nav() {
  var items = ['Dashboard', 'Fleet & Sites', 'Capital', 'People', 'League', 'Log'];
  return h('nav', { style: { width: 164, flexShrink: 0, background: 'var(--panel)', borderRight: '1px solid var(--line)', paddingTop: 12 } },
    items.map(function (t, i) { return h('a', { key: t, href: '#', style: { display: 'block', padding: '9px 16px', fontSize: 14, textDecoration: 'none', color: i === 0 ? 'var(--ink)' : 'var(--ink-muted)', fontWeight: i === 0 ? 600 : 400, background: i === 0 ? 'var(--panel-sunk)' : 'transparent' } }, t); }),
    h('div', { style: { margin: '22px 16px 0' } }, h(G.Tag, { tone: 'tape' }, 'planning Q3…')));
}
function App() {
  return h('div', { className: 'g-paper', style: { width: 1280, height: 720, display: 'flex', flexDirection: 'column', overflow: 'hidden' } },
    h(Top),
    h('div', { style: { flexGrow: 1, display: 'flex', minHeight: 0 } },
      h(Nav),
      h('main', { style: { flexGrow: 1, padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 12, minWidth: 0 } },
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(6, minmax(0, 1fr))', gap: 10 } },
          h(G.KpiTile, { label: 'Hashrate', value: f.hash(720, 'MH'), sub: f.hash(540, 'TH') }),
          h(G.KpiTile, { label: 'Revenue last Q', value: f.money(27200), sub: '▼55% vs Q1', subTone: 'loss' }),
          h(G.KpiTile, { label: 'Power last Q', value: f.money(10200), sub: '+ $6K rent' }),
          h(G.KpiTile, { label: 'Profit / day each', value: h('span', { className: 'g-num-s' }, 'Rig G1 ', h('span', { className: 'g-gain' }, '+$2.82')), sub: h('span', null, 'S9 ', h('span', { className: 'g-gain' }, '+$1.83')) }),
          h(G.KpiTile, { label: 'Cost per coin', value: h('span', { className: 'g-num-s' }, 'BTC $4,300'), sub: h('span', { style: { color: 'var(--ink)' } }, 'ETH $223') }),
          h(G.KpiTile, { label: 'Valuation', value: f.money(119000), sub: 'mostly cash' })),
        h('div', { style: { flexGrow: 1, display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 12, minHeight: 0 } },
          h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
            h('div', { className: 'g-panel', style: { padding: '11px 13px', display: 'flex', flexDirection: 'column', gap: 8 } },
              h('div', { className: 'g-row-between' }, h('span', { className: 'panel-title', style: { fontFamily: 'var(--font-display)' } }, 'Market, last 8 quarters'), h(G.Tag, { tone: 'tape' }, 'winter’s here')),
              h('div', { style: { display: 'flex', gap: 14 } },
                h(G.Sparkline, { series: 'btc', label: 'BTC', width: 150, points: [964, 1786, 3604, 9389, 9862, 7799, 7087, 6480] }),
                h(G.Sparkline, { series: 'eth', label: 'ETH', width: 150, points: [8, 177, 287, 409, 915, 554, 358, 454] }),
                h(G.Sparkline, { series: 'hashprice', label: 'Hashprice', width: 150, points: [736, 880, 1099, 1923, 1144, 500, 310, 323] })),
              h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, padding: '6px 10px', border: '1.5px dashed var(--ink-muted)', borderRadius: 4 } },
                h('span', { style: { flexGrow: 1, fontSize: 13 } }, 'Read the market: a hint about next quarter.'), h(G.Pips, { cost: 1 }), h(G.Button, null, 'Read'))),
            h('div', { className: 'g-panel', style: { padding: '11px 13px', display: 'flex', flexDirection: 'column', gap: 6 } },
              h('div', { className: 'g-row-between' }, h('label', { className: 'g-label', htmlFor: 'hodl' }, 'Sell mined coins this quarter'), h('span', { className: 'g-num-kpi' }, '60%')),
              h('input', { id: 'hodl', type: 'range', min: 0, max: 100, defaultValue: 60, style: { width: '100%', accentColor: 'var(--ink)' } }),
              h('div', { className: 'g-row-between g-num-s g-muted' }, h('span', null, 'HODL everything'), h('span', null, '≈ $10.1K cash'), h('span', null, 'Sell all'))),
            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 10 } },
              h(G.SiteCard, { name: 'Garage', price: f.cents(0.12), used: 3.8, capacity: 5, heat: 22 }),
              h(G.SiteCard, { name: 'Small unit', price: f.cents(0.08), used: 53, capacity: 100, heat: 34, tag: 'neighbour moaning' }))),
          h('div', { className: 'g-panel', style: { padding: '11px 14px', overflow: 'hidden' } },
            h('div', { className: 'g-row-between' }, h('span', { style: { fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 16 } }, 'This quarter’s to-do'), h('span', { className: 'g-num-s g-muted' }, '3 Bandwidth left')),
            h('div', { className: 'g-label', style: { marginTop: 8 } }, 'Operations'),
            h(G.ActionRow, { label: 'Buy / sell machines' }),
            h('div', { className: 'g-label', style: { marginTop: 8 } }, 'Sites & power'),
            h(G.ActionRow, { label: 'Scout a warehouse (1 MW)', cost: 1, price: '$0' }),
            h(G.ActionRow, { label: 'Negotiate power contract', cost: 2, price: '$0' }),
            h('div', { className: 'g-label', style: { marginTop: 8 } }, 'Capital'),
            h(G.ActionRow, { label: 'Pitch seed investors', cost: 2, price: '$0' }),
            h(G.ActionRow, { label: 'Crypto-backed loan', cost: 1, price: '50% LTV' }),
            h(G.ActionRow, { label: 'IPO / SPAC roadshow', disabledReason: 'opens 2021' }),
            h('div', { className: 'g-label', style: { marginTop: 8 } }, 'People & community'),
            h(G.ActionRow, { label: 'Hire Ops Manager', cost: 1, price: '$25K/q' }),
            h(G.ActionRow, { label: 'Community outreach', cost: 1, price: '$5K' }))),
        h('div', { style: { display: 'flex', gap: 12, alignItems: 'center' } },
          h('div', { style: { flexGrow: 1 } }, h(G.NewsTicker, { text: 'New US tariffs hit Chinese-made mining machines' })),
          h(G.Button, { variant: 'primary', size: 'l' }, 'End Quarter →')))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
